name: CI
on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - name: Jest (also dumps the generated Lambda code)
        run: DUMP_INLINE_DIR=$RUNNER_TEMP/inline npx jest
      - name: Python tests of the generated Lambda handlers
        run: |
          pip install pytest==8.3.3
          INLINE_DIR=${{ runner.temp }}/inline pytest -q test/python
      - name: Pack and import from a clean project
        run: npm run verify-package

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full git history with gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --log-opts="--all" --redact --no-banner
